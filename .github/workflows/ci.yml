name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    name: Engine (pure Dart) — analyze, format, 142 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test --reporter expanded

  app:
    name: Flutter app — analyze, widget tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  cli-smoke:
    name: CLI harness — demo playthrough + replay verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - name: Scripted full-subsystem playthrough
        run: dart run living_worlds_engine:lw demo --db /tmp/world.db --verbose
      - name: replay(log) == projection
        run: dart run living_worlds_engine:lw replay /tmp/world.db
