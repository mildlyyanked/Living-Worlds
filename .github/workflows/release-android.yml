name: Release — Android (Play internal testing)

# Two ways to cut a build:
#   - push a tag like v0.1.0
#   - Actions tab -> this workflow -> "Run workflow" (choose the track)
#
# Behavior degrades gracefully while you're still setting up accounts:
#   - No secrets at all      -> debug-signed AAB/APK attached as workflow
#                               artifacts (grab the APK to sideload).
#   - Keystore secrets only  -> properly release-signed artifacts.
#   - + PLAY_SERVICE_ACCOUNT_JSON -> uploaded straight to the Play track,
#                               your phone updates via the Play Store.
# Setup steps for both sets of secrets: docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        type: choice
        default: internal
        options: [internal, alpha, beta]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Never ship a build that fails the suites.
      - name: Engine tests
        working-directory: packages/engine
        run: dart pub get && dart test
      - name: App tests
        working-directory: app
        run: flutter pub get && flutter test

      - name: Materialize release keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # versionCode must increase monotonically for Play; the run number does.
      - name: Build app bundle (+ APK for direct install)
        working-directory: app
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }}
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Attach artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: living-worlds-android-${{ github.run_number }}
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload to Google Play
        if: env.HAS_PLAY_JSON == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.milesware.living_worlds
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
