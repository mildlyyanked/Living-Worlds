name: living_worlds_engine
description: >-
  Deterministic game engine for Living Worlds. The LLM proposes, this engine
  disposes: it validates, clamps, and commits every state change as events in
  an append-only log, with projections rebuilt from that log.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  http: ^1.2.0
  sqlite3: ^2.4.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
